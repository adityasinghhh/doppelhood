# San Francisco, the ten largest US cities by the Census Bureau's Vintage 2025
# population estimates (July 1, 2025), and further cities added on request.
# Any city can be the starting point. state holds the country for cities
# outside the US.
#
# geofabrik names the OpenStreetMap extract that contains the city, from
# https://download.geofabrik.de/.
#
# exclude_labels lists OpenStreetMap place labels that name an area larger
# than a neighborhood, such as New York's boroughs.
#
# wikivoyage_districts records whether Wikivoyage splits the city into district
# articles. Cities without them rely on Wikipedia and OpenStreetMap alone.

cities:
  - slug: san-francisco
    name: San Francisco
    state: CA
    wikidata: Q62
    geofabrik: north-america/us/california/norcal
    wikivoyage: San Francisco
    wikipedia: San Francisco
    wikivoyage_districts: true

  - slug: new-york
    name: New York
    state: NY
    wikidata: Q60
    exclude_labels: [Manhattan, Brooklyn, Queens, The Bronx, Bronx, Staten Island]
    geofabrik: north-america/us/new-york
    population_rank: 1
    wikivoyage: New York City
    wikipedia: New York City
    wikivoyage_districts: true

