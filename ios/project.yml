name: Doppelhood
options:
  bundleIdPrefix: io.github.adityasinghhh
  deploymentTarget:
    iOS: "17.0"
targets:
  Doppelhood:
    type: application
    platform: iOS
    sources:
      - Doppelhood
      - path: ../web/data/matches.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.adityasinghhh.doppelhood
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doppelhood
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
